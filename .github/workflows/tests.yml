name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          python -W error -m unittest discover -s tests -p "test_*.py" 2>&1 | tee test-output.txt
      - name: Report failures
        if: failure()
        shell: bash
        run: python .github/report_failures.py test-output.txt
