[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialforge"
version = "0.5.0"
description = "Deterministic sparse TSDF reconstruction from calibrated RGB-D scans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.4,<2.5",
    "Pillow>=12.1,<13",
]

[project.scripts]
spatialforge = "spatialforge.cli:main"

[tool.setuptools.packages.find]
include = ["spatialforge*"]
